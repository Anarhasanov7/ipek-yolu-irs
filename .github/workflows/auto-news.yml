name: Auto-News Daily
on:
  schedule:
    # Run daily at 02:00 UTC (04:00 Italian time / 05:00 Baku time)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  publish-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run auto-news
        id: auto-news
        env:
          SUPABASE_URL: https://glfizcgayqecnvtfihgy.supabase.co
        run: |
          node .github/scripts/auto-news.mjs 2>&1 | tee /tmp/output.txt
          echo "result<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Regenerate news sitemap
        if: always()
        env:
          SUPABASE_URL: https://glfizcgayqecnvtfihgy.supabase.co
          ADMIN_EMAIL: hasanov.anar.2023@gmail.com
          ADMIN_PASSWORD: GtdibNews2026!Az
        run: node .github/scripts/generate-sitemap.mjs

      - name: Commit updated sitemap
        if: always()
        run: |
          git config user.name "Auto-News Bot"
          git config user.email "noreply@github.com"
          git add sitemap-news.xml
          git diff --staged --quiet || git commit -m "Update news sitemap [skip ci]"
          git push

      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.resend.com
          server_port: 587
          username: resend
          password: ${{ secrets.RESEND_API_KEY }}
          subject: Auto-News Notification
          to: hasanov.anar.2023@gmail.com
          from: GTDIB Auto-News <noreply@europatheducation.eu>
          body: |
            The auto-news script has completed.

            Status: ${{ steps.auto-news.outcome }}

            Log output:
            ${{ steps.auto-news.outputs.result }}

            View full run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
